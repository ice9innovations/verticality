<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orientation review</title>
  <style>
    :root { color-scheme: dark; --bg:#111315; --panel:#1a1d20; --line:#30353a; --text:#f1eee8; --muted:#9ba3aa; --accent:#e4a853; --good:#64c391; --warn:#e2bc58; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,sans-serif; }
    header { position:sticky; top:0; z-index:4; display:flex; align-items:center; gap:16px; min-height:64px; padding:10px 18px; background:#15181bea; backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
    header h1 { margin:0; font:600 18px/1.2 Georgia,serif; letter-spacing:.02em; }
    #progress { color:var(--muted); }
    .controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
    button,select { border:1px solid var(--line); background:#22262a; color:var(--text); border-radius:7px; padding:7px 10px; cursor:pointer; }
    button:hover { border-color:#6b737a; }
    button:disabled { opacity:.35; cursor:default; }
    main { display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 64px); }
    aside { position:sticky; top:64px; height:calc(100vh - 64px); overflow:auto; border-right:1px solid var(--line); background:var(--panel); padding:12px 8px; }
    .album { width:100%; display:grid; grid-template-columns:1fr auto; gap:8px; text-align:left; border:0; background:transparent; padding:7px 10px; color:var(--muted); }
    .album:hover,.album.active { background:#292e33; color:var(--text); }
    .album span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .count { font-variant-numeric:tabular-nums; font-size:12px; }
    #content { min-width:0; padding:18px; }
    #album-title { margin:0 0 14px; font:500 24px Georgia,serif; }
    #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
    .card { position:relative; min-width:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
    .card.reviewed { border-color:#35654c; }
    .card.selected { outline:2px solid var(--accent); outline-offset:2px; }
    .photo { height:230px; display:grid; place-items:center; overflow:hidden; background:#090a0b; }
    .photo img { max-width:100%; max-height:100%; object-fit:contain; transition:transform .15s ease; }
    .missing { color:var(--muted); padding:20px; text-align:center; }
    .meta { padding:9px 10px 6px; }
    .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .detail { display:flex; justify-content:space-between; margin-top:4px; color:var(--muted); font-size:12px; }
    .status-uncertain { color:var(--warn); } .status-error,.status-missing { color:#e47b72; }
    .actions { display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:6px; padding:6px 10px 10px; }
    .accept { color:var(--good); }
    .badge { position:absolute; top:8px; right:8px; border-radius:20px; padding:3px 7px; background:#101214d9; font-size:11px; }
    .variants { position:absolute; top:8px; left:8px; border-radius:20px; padding:3px 7px; background:#101214d9; color:var(--muted); font-size:11px; }
    #pager { display:flex; justify-content:center; align-items:center; gap:12px; margin:20px; }
    #empty { display:none; color:var(--muted); padding:50px; text-align:center; }
    @media(max-width:760px){ main{grid-template-columns:1fr} aside{position:static;height:180px;border-right:0;border-bottom:1px solid var(--line)} header{flex-wrap:wrap}.controls{margin-left:0} }
  </style>
</head>
<body>
<header>
  <h1>Orientation review</h1><span id="progress"></span>
  <div class="controls">
    <select id="filter"><option value="unreviewed">Unreviewed</option><option value="uncertain">Uncertain / errors</option><option value="all">All</option></select>
    <button id="prev">← Page</button><span id="page-label"></span><button id="next">Page →</button>
  </div>
</header>
<main>
  <aside><button class="album active" data-album=""><span>All albums</span><span class="count" id="all-count"></span></button><div id="albums"></div></aside>
  <section id="content"><h2 id="album-title">All albums</h2><div id="grid"></div><div id="empty">Nothing to review here.</div><div id="pager"></div></section>
</main>
<script>
const state={album:'',filter:'unreviewed',page:1,pageSize:60,images:[],selected:0,total:0};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadAlbums(){const d=await api('/api/albums');$('#progress').textContent=`${d.totals.reviewed||0} / ${d.totals.total||0} reviewed`;$('#all-count').textContent=d.totals.total||0;$('#albums').innerHTML=d.albums.map(a=>`<button class="album" data-album="${esc(a.album)}" style="padding-left:${10+Math.max(0,a.album.split('/').length-1)*12}px"><span title="${esc(a.album)}">${esc(a.album.split('/').pop())}</span><span class="count">${a.reviewed||0}/${a.total}</span></button>`).join('');document.querySelectorAll('.album').forEach(b=>{b.classList.toggle('active',b.dataset.album===state.album);b.onclick=()=>selectAlbum(b.dataset.album,b);});}
async function loadImages(){const q=new URLSearchParams({album:state.album,state:state.filter,page:state.page,page_size:state.pageSize});const d=await api('/api/images?'+q);state.images=d.images;state.total=d.total;state.selected=Math.min(state.selected,Math.max(0,state.images.length-1));render();}
function render(){const pages=Math.max(1,Math.ceil(state.total/state.pageSize));$('#page-label').textContent=`${state.page} / ${pages}`;$('#prev').disabled=state.page<=1;$('#next').disabled=state.page>=pages;$('#album-title').textContent=state.album||'All albums';$('#empty').style.display=state.images.length?'none':'block';$('#grid').innerHTML=state.images.map((x,i)=>{const delta=((x.selected_correction-x.predicted_correction)%360+360)%360;const confidence=x.confidence==null?'—':`${(x.confidence*100).toFixed(1)}%`;return `<article class="card ${x.reviewed?'reviewed':''} ${i===state.selected?'selected':''}" data-index="${i}">${x.variant_count>1?`<span class="variants">${x.variant_count} variants</span>`:''}<span class="badge status-${esc(x.prediction_status)}">${esc(x.prediction_status)}</span><div class="photo">${x.thumbnail?`<img loading="lazy" src="/thumbnails/${encodeURI(x.thumbnail)}" style="transform:rotate(${delta}deg)">`:`<div class="missing">${esc(x.error||'No thumbnail')}</div>`}</div><div class="meta"><div class="name" title="${esc(x.variant_paths.join('\n'))}">${esc(x.relative_path.split('/').pop())}</div><div class="detail"><span>${confidence}</span><span>apply ${x.selected_correction}°</span></div></div><div class="actions"><button data-action="left">↺ 90°</button><button class="accept" data-action="accept">${x.reviewed?'✓ Reviewed':'Accept'}</button><button data-action="right">90° ↻</button></div></article>`}).join('');document.querySelectorAll('.card').forEach(c=>{c.onclick=e=>{state.selected=+c.dataset.index;if(e.target.dataset.action)act(e.target.dataset.action,state.selected);else render();};});}
async function act(action,index=state.selected){const x=state.images[index];if(!x)return;if(action==='left')x.selected_correction=(x.selected_correction+270)%360;if(action==='right')x.selected_correction=(x.selected_correction+90)%360;if(action==='accept')x.reviewed=1;await api('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group_key:x.group_key,selected_correction:x.selected_correction,reviewed:Boolean(x.reviewed)})});if(action==='accept'&&state.filter==='unreviewed'){state.images.splice(index,1);state.total--;state.selected=Math.min(index,Math.max(0,state.images.length-1));if(!state.images.length&&state.total)loadImages();}render();loadAlbums();}
function selectAlbum(album,button){state.album=album;state.page=1;state.selected=0;document.querySelectorAll('.album').forEach(b=>b.classList.remove('active'));button.classList.add('active');loadImages();}
$('#filter').onchange=e=>{state.filter=e.target.value;state.page=1;loadImages()};$('#prev').onclick=()=>{if(state.page>1){state.page--;loadImages()}};$('#next').onclick=()=>{if(state.page*state.pageSize<state.total){state.page++;loadImages()}};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();act('left')}else if(e.key==='ArrowRight'){e.preventDefault();act('right')}else if(e.key===' '||e.key==='Enter'){e.preventDefault();act('accept')}else if(e.key.toLowerCase()==='j'){state.selected=Math.min(state.images.length-1,state.selected+1);render()}else if(e.key.toLowerCase()==='k'){state.selected=Math.max(0,state.selected-1);render()}});
loadAlbums().then(loadImages);
</script>
</body></html>
